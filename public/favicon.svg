<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F97316" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Round Circle Badge -->
  <circle cx="50" cy="50" r="46" fill="url(#bg)" stroke="url(#gold)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Gold Upward Arrow (Comparison & Savings) -->
  <path d="M 32 70 L 68 32 M 52 32 L 68 32 L 68 48" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sleek Luxury Volvo Bus Body -->
  <rect x="18" y="42" width="58" height="25" rx="6" fill="#1E293B" stroke="url(#gold)" stroke-width="2"/>
  <!-- Front Windshield -->
  <path d="M 60 45 L 73 45 Q 76 45 76 48 L 76 57 Q 76 59 74 59 L 60 59 Z" fill="#38BDF8" opacity="0.9"/>
  <!-- Side Windows -->
  <rect x="22" y="47" width="8" height="9" rx="2" fill="#F8FAFC" opacity="0.85"/>
  <rect x="32" y="47" width="8" height="9" rx="2" fill="#F8FAFC" opacity="0.85"/>
  <rect x="42" y="47" width="8" height="9" rx="2" fill="#F8FAFC" opacity="0.85"/>
  <rect x="52" y="47" width="6" height="9" rx="2" fill="#F8FAFC" opacity="0.85"/>
  <!-- Gold Accent Stripe -->
  <path d="M 18 60 Q 45 56 76 61" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- Wheels -->
  <circle cx="30" cy="67" r="5.5" fill="#020617" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="62" cy="67" r="5.5" fill="#020617" stroke="url(#gold)" stroke-width="1.5"/>
</svg>
