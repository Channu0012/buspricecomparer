<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2540"/>
      <stop offset="100%" stop-color="#0C1220"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="url(#orange)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Bus body (main rectangle) -->
  <rect x="9" y="30" width="38" height="18" rx="4" fill="url(#body-grad)"/>

  <!-- Bus roof curve -->
  <path d="M13 30 Q14 24 18 23 L44 23 Q48 24 47 30 Z" fill="#2563EB"/>

  <!-- Windshield (front) -->
  <rect x="42" y="25" width="6" height="8" rx="2" fill="#BFDBFE" opacity="0.9"/>

  <!-- Windows row -->
  <rect x="12" y="25" width="6" height="6" rx="1.5" fill="#BFDBFE" opacity="0.75"/>
  <rect x="20" y="25" width="6" height="6" rx="1.5" fill="#BFDBFE" opacity="0.75"/>
  <rect x="28" y="25" width="6" height="6" rx="1.5" fill="#BFDBFE" opacity="0.75"/>
  <rect x="36" y="25" width="5" height="6" rx="1.5" fill="#BFDBFE" opacity="0.75"/>

  <!-- Orange stripe along bus side -->
  <rect x="9" y="38" width="38" height="3" rx="1" fill="url(#orange)"/>

  <!-- Wheels -->
  <circle cx="18" cy="49" r="4.5" fill="#0F172A" stroke="#94A3B8" stroke-width="1.2"/>
  <circle cx="18" cy="49" r="2" fill="#64748B"/>
  <circle cx="38" cy="49" r="4.5" fill="#0F172A" stroke="#94A3B8" stroke-width="1.2"/>
  <circle cx="38" cy="49" r="2" fill="#64748B"/>

  <!-- Price compare arrows (top right overlay) -->
  <!-- Down arrow (price check) -->
  <circle cx="50" cy="15" r="9" fill="url(#orange)"/>
  <!-- ₹ symbol -->
  <text x="50" y="19" text-anchor="middle" font-family="Arial" font-size="11" font-weight="900" fill="white">₹</text>
</svg>
