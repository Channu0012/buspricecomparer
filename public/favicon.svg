<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="96" height="96" rx="22" ry="22" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Shine overlay -->
  <rect x="2" y="2" width="96" height="50" rx="22" ry="22" fill="url(#shine)"/>

  <!-- Bus body (white, bold, simple) -->
  <!-- Main bus rectangle -->
  <rect x="14" y="42" width="60" height="30" rx="6" fill="white" opacity="0.95"/>
  <!-- Bus roof / cab section -->
  <rect x="18" y="30" width="52" height="16" rx="5" fill="white" opacity="0.95"/>
  <!-- Front windshield (dark) -->
  <rect x="59" y="33" width="9" height="10" rx="2" fill="#F97316"/>
  <!-- Side windows (dark) -->
  <rect x="20" y="33" width="8" height="8" rx="2" fill="#F97316"/>
  <rect x="31" y="33" width="8" height="8" rx="2" fill="#F97316"/>
  <rect x="42" y="33" width="8" height="8" rx="2" fill="#F97316"/>
  <!-- Orange stripe on bus body -->
  <rect x="14" y="55" width="60" height="6" rx="0" fill="#F97316" opacity="0.6"/>
  <!-- Wheels (dark circles) -->
  <circle cx="28" cy="74" r="7" fill="#1E293B"/>
  <circle cx="28" cy="74" r="3" fill="white" opacity="0.7"/>
  <circle cx="58" cy="74" r="7" fill="#1E293B"/>
  <circle cx="58" cy="74" r="3" fill="white" opacity="0.7"/>

  <!-- ₹ badge (small circle top-right) -->
  <circle cx="80" cy="22" r="14" fill="#1E293B"/>
  <circle cx="80" cy="22" r="14" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.5"/>
  <text x="80" y="27" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="900" fill="white">₹</text>
</svg>
