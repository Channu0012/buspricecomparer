<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0C1E35"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="bus-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A4F7C"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="url(#gold)" stroke-width="2"/>

  <!-- Upward trend arrow (gold) -->
  <polyline points="10,48 22,34 30,40 48,18" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow head -->
  <polygon points="48,18 42,20 46,24" fill="url(#gold)"/>

  <!-- Bus body -->
  <rect x="12" y="34" width="36" height="16" rx="4" fill="url(#bus-body)" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- Bus windshield / front -->
  <rect x="41" y="36" width="5" height="8" rx="1" fill="url(#gold)" opacity="0.85"/>

  <!-- Bus windows row -->
  <rect x="14" y="36.5" width="5" height="5" rx="1" fill="url(#gold)" opacity="0.6"/>
  <rect x="21" y="36.5" width="5" height="5" rx="1" fill="url(#gold)" opacity="0.6"/>
  <rect x="28" y="36.5" width="5" height="5" rx="1" fill="url(#gold)" opacity="0.6"/>
  <rect x="35" y="36.5" width="5" height="5" rx="1" fill="url(#gold)" opacity="0.6"/>

  <!-- Underline stripe (gold) -->
  <rect x="12" y="48" width="36" height="2" rx="1" fill="url(#gold)"/>

  <!-- Wheels -->
  <circle cx="20" cy="51" r="4" fill="#0C1E35" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="20" cy="51" r="1.5" fill="url(#gold)"/>
  <circle cx="40" cy="51" r="4" fill="#0C1E35" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="40" cy="51" r="1.5" fill="url(#gold)"/>
</svg>
